<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Barbearia Studio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="login-box">
    <div class="login-top">
      <div class="logo-icone">✂️💈</div>
      <h2>Barbearia Studio</h2>
      <p>Informe seus dados para acessar o sistema</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">E-mail de Usuário</label>
        <input type="email" id="email" required placeholder="admin@barbearia.com">
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required placeholder="Digite sua senha">
      </div>

      <button type="submit" id="btnSubmit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">
        Entrar
      </button>

      <!-- Mensagem de erro simples -->
      <div id="mensagemErro" class="alerta alerta-erro" style="margin-top: 1rem;"></div>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.78rem; color: #94a3b8;">
      Sistema de Gestão Interna • Barbearia Studio
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
